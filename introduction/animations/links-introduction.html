<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links Platform Introduction - Smooth Animation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
        }

        .container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .canvas {
            width: 800px;
            height: 600px;
            position: relative;
        }

        /* Point styling */
        .point {
            position: absolute;
            width: 8px;
            height: 8px;
            background: #4ecdc4;
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(78, 205, 196, 0.8);
            transform: translate(-50%, -50%);
            opacity: 0;
            transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .point.visible {
            opacity: 1;
        }

        /* Link styling (line between two points) */
        .link {
            position: absolute;
            height: 2px;
            background: linear-gradient(90deg,
                rgba(78, 205, 196, 0.6) 0%,
                rgba(255, 107, 107, 0.6) 50%,
                rgba(78, 205, 196, 0.6) 100%);
            transform-origin: 0 50%;
            opacity: 0;
            transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 10px rgba(78, 205, 196, 0.4);
        }

        .link.visible {
            opacity: 1;
        }

        /* Circle that encircles the structure */
        .encircle {
            position: absolute;
            border: 3px solid rgba(78, 205, 196, 0.8);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            opacity: 0;
            transition: all 2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 30px rgba(78, 205, 196, 0.6),
                        inset 0 0 30px rgba(78, 205, 196, 0.3);
        }

        .encircle.visible {
            opacity: 1;
        }

        /* Central point for final scene */
        .central-point {
            position: absolute;
            width: 12px;
            height: 12px;
            background: radial-gradient(circle, #4ecdc4 0%, #2a9d8f 100%);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            opacity: 0;
            transition: all 1.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 30px rgba(78, 205, 196, 1);
        }

        .central-point.visible {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        /* Info text */
        .info {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            font-size: 18px;
            color: rgba(255, 255, 255, 0.7);
            transition: opacity 0.5s ease;
        }

        .info .phase {
            font-size: 24px;
            font-weight: 600;
            color: #4ecdc4;
            margin-bottom: 10px;
        }

        /* Controls */
        .controls {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
        }

        button {
            padding: 10px 20px;
            background: rgba(78, 205, 196, 0.2);
            border: 2px solid #4ecdc4;
            color: #4ecdc4;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        button:hover {
            background: rgba(78, 205, 196, 0.4);
            box-shadow: 0 0 15px rgba(78, 205, 196, 0.5);
        }

        button:active {
            transform: scale(0.95);
        }

        /* Progress indicator */
        .progress {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 200px;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #4ecdc4 0%, #ff6b6b 100%);
            width: 0%;
            transition: width 0.3s ease;
            border-radius: 2px;
        }

        /* Node labels for understanding */
        .label {
            position: absolute;
            font-size: 10px;
            color: rgba(255, 255, 255, 0.5);
            transform: translate(-50%, -150%);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .label.visible {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="canvas" id="canvas">
            <div class="central-point" id="centralPoint"></div>
            <div class="encircle" id="encircle"></div>
        </div>

        <div class="info" id="info">
            <div class="phase" id="phase">Beginning of Everything</div>
            <div id="description">In the beginning, there was nothing...</div>
        </div>

        <div class="controls">
            <button id="pauseBtn">Pause</button>
            <button id="restartBtn">Restart</button>
        </div>

        <div class="progress">
            <div class="progress-bar" id="progressBar"></div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const info = document.getElementById('info');
        const phaseText = document.getElementById('phase');
        const descriptionText = document.getElementById('description');
        const centralPoint = document.getElementById('centralPoint');
        const encircle = document.getElementById('encircle');
        const pauseBtn = document.getElementById('pauseBtn');
        const restartBtn = document.getElementById('restartBtn');
        const progressBar = document.getElementById('progressBar');

        let isPaused = false;
        let animationTimeout = null;
        let currentPhase = 0;

        // Animation phases with descriptions
        const phases = [
            {
                name: "The Beginning",
                description: "In the beginning, there was nothing...",
                duration: 2000
            },
            {
                name: "First Link",
                description: "A single point emerges from the void",
                duration: 2000
            },
            {
                name: "Connection Forms",
                description: "The point splits and creates the first link",
                duration: 2500
            },
            {
                name: "Network Grows",
                description: "Links multiply and form patterns",
                duration: 3000
            },
            {
                name: "Complex Structure",
                description: "A rich network of interconnected links",
                duration: 3000
            },
            {
                name: "Deep Hierarchy",
                description: "Links reference other links, creating depth",
                duration: 3000
            },
            {
                name: "The Encircling",
                description: "All complexity is recognized as one unified structure",
                duration: 3000
            },
            {
                name: "Compression",
                description: "The structure compresses into a single link",
                duration: 2500
            },
            {
                name: "Return to Unity",
                description: "Back to a single point - containing everything within",
                duration: 2000
            },
            {
                name: "The Cycle Completes",
                description: "The point fades into the void, ready to begin again...",
                duration: 2500
            }
        ];

        // Store created elements for cleanup
        let points = [];
        let links = [];
        let labels = [];

        // Helper function to create a point
        function createPoint(x, y, label = '') {
            const point = document.createElement('div');
            point.className = 'point';
            point.style.left = x + 'px';
            point.style.top = y + 'px';
            canvas.appendChild(point);
            points.push(point);

            if (label) {
                const labelEl = document.createElement('div');
                labelEl.className = 'label';
                labelEl.textContent = label;
                labelEl.style.left = x + 'px';
                labelEl.style.top = y + 'px';
                canvas.appendChild(labelEl);
                labels.push(labelEl);
            }

            return point;
        }

        // Helper function to create a link between two points
        function createLink(x1, y1, x2, y2) {
            const dx = x2 - x1;
            const dy = y2 - y1;
            const length = Math.sqrt(dx * dx + dy * dy);
            const angle = Math.atan2(dy, dx) * 180 / Math.PI;

            const link = document.createElement('div');
            link.className = 'link';
            link.style.left = x1 + 'px';
            link.style.top = y1 + 'px';
            link.style.width = length + 'px';
            link.style.transform = `rotate(${angle}deg)`;
            canvas.appendChild(link);
            links.push(link);

            return link;
        }

        // Clear all elements
        function clearElements() {
            points.forEach(p => p.remove());
            links.forEach(l => l.remove());
            labels.forEach(l => l.remove());
            points = [];
            links = [];
            labels = [];
        }

        // Update phase information
        function updatePhase(phaseIndex) {
            const phase = phases[phaseIndex];
            phaseText.textContent = phase.name;
            descriptionText.textContent = phase.description;
            const progress = ((phaseIndex + 1) / phases.length) * 100;
            progressBar.style.width = progress + '%';
        }

        // Phase 1: Empty (nothing)
        function phase1() {
            clearElements();
            centralPoint.classList.remove('visible');
            encircle.classList.remove('visible');
            updatePhase(0);
        }

        // Phase 2: Single point appears
        function phase2() {
            updatePhase(1);
            centralPoint.classList.add('visible');
        }

        // Phase 3: Point splits into first link (2 points connected)
        function phase3() {
            updatePhase(2);
            centralPoint.classList.remove('visible');

            setTimeout(() => {
                const p1 = createPoint(350, 300, 'A');
                const p2 = createPoint(450, 300, 'B');
                const l1 = createLink(350, 300, 450, 300);

                setTimeout(() => {
                    p1.classList.add('visible');
                    p2.classList.add('visible');
                    l1.classList.add('visible');
                    labels.forEach(l => l.classList.add('visible'));
                }, 50);
            }, 400);
        }

        // Phase 4: Network grows (triangle structure)
        function phase4() {
            updatePhase(3);

            setTimeout(() => {
                const p3 = createPoint(400, 200, 'C');
                const l2 = createLink(350, 300, 400, 200);
                const l3 = createLink(450, 300, 400, 200);

                setTimeout(() => {
                    p3.classList.add('visible');
                    l2.classList.add('visible');
                    l3.classList.add('visible');
                    labels[labels.length - 1].classList.add('visible');
                }, 50);
            }, 300);
        }

        // Phase 5: Complex structure (add more nodes)
        function phase5() {
            updatePhase(4);

            setTimeout(() => {
                const p4 = createPoint(300, 250, 'D');
                const p5 = createPoint(500, 250, 'E');
                const p6 = createPoint(400, 350, 'F');

                const l4 = createLink(350, 300, 300, 250);
                const l5 = createLink(450, 300, 500, 250);
                const l6 = createLink(350, 300, 400, 350);
                const l7 = createLink(450, 300, 400, 350);
                const l8 = createLink(300, 250, 400, 200);
                const l9 = createLink(500, 250, 400, 200);

                setTimeout(() => {
                    p4.classList.add('visible');
                    p5.classList.add('visible');
                    p6.classList.add('visible');
                    l4.classList.add('visible');
                    l5.classList.add('visible');
                    l6.classList.add('visible');
                    l7.classList.add('visible');
                    l8.classList.add('visible');
                    l9.classList.add('visible');
                    labels.slice(-3).forEach(l => l.classList.add('visible'));
                }, 50);
            }, 300);
        }

        // Phase 6: Deep hierarchy (add inner connections)
        function phase6() {
            updatePhase(5);

            setTimeout(() => {
                // Add cross connections to show depth
                const l10 = createLink(300, 250, 500, 250);
                const l11 = createLink(300, 250, 400, 350);
                const l12 = createLink(500, 250, 400, 350);
                const l13 = createLink(400, 200, 400, 350);

                setTimeout(() => {
                    l10.classList.add('visible');
                    l11.classList.add('visible');
                    l12.classList.add('visible');
                    l13.classList.add('visible');
                }, 50);
            }, 300);
        }

        // Phase 7: Encircle the structure
        function phase7() {
            updatePhase(6);

            // Calculate bounding circle
            encircle.style.width = '400px';
            encircle.style.height = '400px';
            encircle.classList.add('visible');
        }

        // Phase 8: Compress into single point
        function phase8() {
            updatePhase(7);

            // Start shrinking the circle
            encircle.style.width = '300px';
            encircle.style.height = '300px';

            setTimeout(() => {
                // Fade out all points and links
                points.forEach(p => p.style.opacity = '0');
                links.forEach(l => l.style.opacity = '0');
                labels.forEach(l => l.style.opacity = '0');

                // Continue shrinking
                encircle.style.width = '100px';
                encircle.style.height = '100px';
            }, 800);

            setTimeout(() => {
                // Final shrink to point size
                encircle.style.width = '20px';
                encircle.style.height = '20px';
            }, 1600);
        }

        // Phase 9: Return to single point
        function phase9() {
            updatePhase(8);

            setTimeout(() => {
                // Clear everything except central point
                clearElements();
                encircle.classList.remove('visible');
                encircle.style.width = '400px';
                encircle.style.height = '400px';

                // Show central point
                centralPoint.classList.add('visible');
            }, 300);
        }

        // Phase 10: Point fades away
        function phase10() {
            updatePhase(9);

            setTimeout(() => {
                centralPoint.classList.remove('visible');
            }, 500);
        }

        // Run all phases in sequence
        function runAnimation() {
            if (isPaused) return;

            const sequence = [
                { fn: phase1, delay: 0 },
                { fn: phase2, delay: phases[0].duration },
                { fn: phase3, delay: phases[0].duration + phases[1].duration },
                { fn: phase4, delay: phases[0].duration + phases[1].duration + phases[2].duration },
                { fn: phase5, delay: phases[0].duration + phases[1].duration + phases[2].duration + phases[3].duration },
                { fn: phase6, delay: phases[0].duration + phases[1].duration + phases[2].duration + phases[3].duration + phases[4].duration },
                { fn: phase7, delay: phases[0].duration + phases[1].duration + phases[2].duration + phases[3].duration + phases[4].duration + phases[5].duration },
                { fn: phase8, delay: phases[0].duration + phases[1].duration + phases[2].duration + phases[3].duration + phases[4].duration + phases[5].duration + phases[6].duration },
                { fn: phase9, delay: phases[0].duration + phases[1].duration + phases[2].duration + phases[3].duration + phases[4].duration + phases[5].duration + phases[6].duration + phases[7].duration },
                { fn: phase10, delay: phases[0].duration + phases[1].duration + phases[2].duration + phases[3].duration + phases[4].duration + phases[5].duration + phases[6].duration + phases[7].duration + phases[8].duration }
            ];

            sequence.forEach(({ fn, delay }) => {
                animationTimeout = setTimeout(() => {
                    if (!isPaused) fn();
                }, delay);
            });

            // Calculate total duration
            const totalDuration = phases.reduce((sum, phase) => sum + phase.duration, 0);

            // Restart after completion
            animationTimeout = setTimeout(() => {
                if (!isPaused) runAnimation();
            }, totalDuration);
        }

        // Control buttons
        pauseBtn.addEventListener('click', () => {
            isPaused = !isPaused;
            pauseBtn.textContent = isPaused ? 'Resume' : 'Pause';
            if (!isPaused) {
                runAnimation();
            }
        });

        restartBtn.addEventListener('click', () => {
            clearTimeout(animationTimeout);
            isPaused = false;
            pauseBtn.textContent = 'Pause';
            currentPhase = 0;
            phase1();
            setTimeout(runAnimation, 100);
        });

        // Start the animation
        phase1();
        setTimeout(runAnimation, 1000);
    </script>
</body>
</html>
